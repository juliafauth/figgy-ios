<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Figgy — prévia interativa</title>
<style>
:root{--ink:#33224e;--muted:#74677d;--purple:#7645d9;--paper:#faf8fd;--line:#ece5f3;--pink:#ffdcea;--mint:#bde9d1}*{box-sizing:border-box}body{margin:0;background:#ede7f3;color:var(--ink);font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #36a380;outline-offset:3px}.preview-note{text-align:center;padding:15px;font-size:13px;color:#655471}.preview-note strong{color:var(--purple)}.phone{max-width:440px;margin:0 auto 30px;background:var(--paper);border:1px solid #ddd1ec;border-radius:32px;overflow:hidden;box-shadow:0 20px 80px #48305c18}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 4px}.brand{font-size:32px;font-weight:850;letter-spacing:-1.7px;display:flex;align-items:center;gap:9px}.brand img{width:36px;height:36px;border-radius:12px}.tag{font-size:9px;font-weight:800;letter-spacing:1.4px;color:var(--muted)}main{padding:20px 22px 28px;min-height:580px}.hero{padding:24px 24px 15px;border-radius:28px;background:linear-gradient(135deg,#e9daff,#ffdcea)}h1{font-size:32px;line-height:1.12;letter-spacing:-1px;margin:0 0 12px}p{font-size:14px;line-height:1.6;margin:8px 0;color:var(--muted)}.hero p{color:#604d70}.floating{display:flex;gap:0;margin:6px -16px}.floating img{width:33.33%;transform:rotate(-7deg)}.floating img:nth-child(2){transform:rotate(8deg)}.free{font-size:11px;font-weight:750;letter-spacing:.3px}h2{font-size:19px;margin:22px 0 14px;letter-spacing:-.5px}.search{border:1px solid var(--line);background:white;border-radius:16px;padding:13px 16px;width:100%;margin:18px 0 0;font-size:14px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.chip{background:white;border:0;border-radius:30px;padding:11px 15px;font-size:12px;font-weight:650;color:var(--ink)}.chip.active{background:var(--purple);color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.pack{background:white;border:1px solid #f0eaf6;border-radius:23px;padding:11px;display:block;text-align:left;width:100%;color:inherit}.tile{border-radius:16px;display:flex;align-items:center;justify-content:center;padding:5px;height:112px;overflow:hidden}.tile img{width:50%;max-height:100px;object-fit:contain}.pack-title{display:block;margin:12px 0 7px;font-size:14px;font-weight:750;letter-spacing:-.3px}.pack-meta{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:10px;color:var(--muted)}.pack-meta b{font-size:9px;color:var(--purple)}.footnote{text-align:center;font-size:11px;line-height:1.6;color:var(--muted);padding-top:22px}.nav{display:grid;grid-template-columns:repeat(3,1fr);padding:10px 8px 16px;background:white;border-top:1px solid var(--line)}.nav button{border:0;background:none;color:#93849f;display:flex;align-items:center;flex-direction:column;gap:6px;font-size:11px;font-weight:600;padding:8px}.nav button.active{color:var(--purple)}.nav-icon{font-size:24px;line-height:26px}.primary{border:0;border-radius:17px;background:var(--purple);color:white;padding:15px 17px;width:100%;font-weight:750;font-size:14px}.secondary{background:#368564}.soft{background:#eee4fb;color:var(--purple)}.row{display:flex;gap:12px;align-items:center}.row>*{min-width:0}.row .primary{flex:1}.back{padding:0;background:none;border:0;color:var(--purple);font-weight:650;margin-bottom:18px}.sticker-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}.sticker-cell{background:white;padding:8px;border-radius:18px;position:relative}.sticker-cell img{width:100%}.library-pack{width:100%;display:block;background:white;color:inherit;text-align:left;padding:18px;border:0;border-radius:24px;margin:16px 0}.library-pack .pack-title{font-size:19px;margin-top:0}.library-strip{display:flex;background:#f0e7fd;border-radius:16px;padding:6px;margin-top:12px;height:86px}.library-strip img{max-width:25%;object-fit:contain;flex:1}.empty{text-align:center;padding:44px 18px;font-weight:650}.empty span{display:block;font-size:44px;margin-bottom:14px}.canvas-wrap{background-color:#ece7f0;background-image:linear-gradient(45deg,#fff8 25%,transparent 25%),linear-gradient(-45deg,#fff8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#fff8 75%),linear-gradient(-45deg,transparent 75%,#fff8 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0;border-radius:26px;padding:8px;margin:14px 0 18px}canvas{display:block;width:100%;height:auto}.field{display:block;font-size:13px;font-weight:650;margin:18px 0 7px}.input{width:100%;background:white;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink)}.option-card{background:white;border-radius:18px;padding:16px;margin:15px 0;font-size:13px}.option-card b{display:block;font-size:14px;margin-bottom:5px}.option-card span{color:var(--muted);font-size:12px}.swatches{display:flex;gap:10px;flex-wrap:wrap}.swatch{width:36px;height:36px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #ddd}.swatch.active{outline:3px solid var(--purple);outline-offset:2px}input[type=range]{width:100%;accent-color:var(--purple)}.check{font-size:13px;display:flex;align-items:center;gap:10px;margin:15px 0}.small-button{border:0;background:#eee4fb;color:var(--purple);padding:10px;border-radius:12px;font-size:12px}.delete{position:absolute;right:3px;top:3px;border:0;background:#fff;color:#9c345d;font-size:12px;border-radius:50%;width:26px;height:26px}.toast{background:#33224e;color:white;padding:13px 16px;border-radius:16px;font-size:13px;line-height:1.5;margin:0 20px 16px}.toast[hidden]{display:none}dialog{border:0;border-radius:25px;padding:25px;max-width:min(390px,90vw);color:var(--ink);box-shadow:0 20px 100px #0003}dialog::backdrop{background:#35244d77}dialog h2{margin-top:0}dialog p{margin-bottom:20px}.native-note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6}.hidden{display:none}@media(max-width:470px){body{background:var(--paper)}.phone{border:0;border-radius:0;margin:0;box-shadow:none}.preview-note{font-size:11px;padding:12px}main{min-height:0}.tag{font-size:8px}h1{font-size:30px}.grid{gap:10px}.chips{gap:5px}.chip{padding:10px 12px}.row{gap:8px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<div class="preview-note"><strong>Prévia interativa</strong> · Teste o visual no Windows. As integrações funcionam no app iOS.</div>
<div class="phone"><header class="top"><div class="brand"><img id="appicon" alt="">figgy</div><span class="tag">FEITO PARA EXPRESSAR</span></header><main id="screen"></main><div class="toast" id="toast" role="status" hidden></div><nav class="nav" aria-label="Navegação"><button data-nav="explore" class="active"><span class="nav-icon" aria-hidden="true">✦</span>Explorar</button><button data-nav="create"><span class="nav-icon" aria-hidden="true">⊞</span>Criar</button><button data-nav="library"><span class="nav-icon" aria-hidden="true">▱</span>Meus packs</button></nav></div>
<input id="photo-input" class="hidden" type="file" accept="image/png,image/jpeg,image/webp"><input id="pack-input" class="hidden" type="file" accept=".figpack,.zip">
<dialog id="info"><h2 id="info-title"></h2><p id="info-text"></p><button class="primary" id="close-info">Entendi</button></dialog>
<script>/*JSZIP*/</script>
<script>
const catalog=/*CATALOG*/;
const icon=/*ICON*/;
document.getElementById('appicon').src=icon;
const screen=document.getElementById('screen');const toastNode=document.getElementById('toast');
let page='explore',category='Todos',query='',detail=null,packs=[],timer;
let editor={image:null,text:'',background:null,padding:16,top:false,size:46,packID:null};
try{packs=JSON.parse(localStorage.getItem('figgy-preview-v1')||'[]')}catch{}
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(16)+'-'+Math.random().toString(16).slice(2)}
function toast(message){clearTimeout(timer);toastNode.textContent=message;toastNode.hidden=false;timer=setTimeout(()=>toastNode.hidden=true,5500)}
function persist(){try{localStorage.setItem('figgy-preview-v1',JSON.stringify(packs));return true}catch{toast('O navegador ficou sem espaço. Baixe um pack antes de adicionar mais imagens.');return false}}
function setPage(p){page=p;detail=null;render()}
function imageTag(src,alt=''){return `<img src="${escape(src)}" alt="${escape(alt)}">`}
function render(){
 document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));
 if(detail){renderDetail();return}
 if(page==='explore')renderExplore();else if(page==='library')renderLibrary();else renderEditor();
}
function renderExplore(){
 screen.innerHTML=`<section class="hero"><h1>Sua conversa,<br>com a sua cara.</h1><p>Crie, colecione e compartilhe.<br>No WhatsApp e no seu iPhone.</p><div class="floating">${catalog[0].images.slice(0,3).map(s=>imageTag(s)).join('')}</div><span class="free">♥ Packs grátis, sempre</span></section><label class="hidden" for="search">Buscar packs</label><input class="search" id="search" placeholder="Encontre seu próximo pack" value="${escape(query)}"><h2>Um pack para cada mood</h2><div class="chips">${['Todos','Reações','Fofo','Estudos'].map(c=>`<button class="chip ${category===c?'active':''}" data-category="${c}" aria-pressed="${category===c}">${c}</button>`).join('')}</div><div class="grid" id="cards"></div><div class="footnote">Sem anúncios. Sem assinatura.<br>Suas criações ficam com você.</div>`;
 renderCards();document.getElementById('search').oninput=e=>{query=e.target.value;renderCards()};
 screen.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;renderExplore()});
}
function renderCards(){const shown=catalog.filter(p=>(category==='Todos'||p.category===category)&&p.name.toLowerCase().includes(query.toLowerCase()));document.getElementById('cards').innerHTML=shown.map(p=>`<button class="pack" data-pack="${p.id}"><div class="tile" style="background:#${p.color}55">${p.images.slice(0,2).map(i=>imageTag(i)).join('')}</div><span class="pack-title">${escape(p.name)}</span><span class="pack-meta">${p.images.length} figurinhas <b>GRÁTIS</b></span></button>`).join('')||'<p>Nenhum pack com esse nome.</p>';screen.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>{detail={type:'catalog',id:b.dataset.pack};renderDetail()})}
function renderLibrary(){
 screen.innerHTML=`<h1>Seu cantinho<br>de figurinhas.</h1><div class="row" style="margin-top:22px"><button class="primary" id="newpack">+ Novo pack</button><button class="primary secondary" id="importpack">↓ Importar pack</button></div>${packs.length?packs.map(p=>`<button class="library-pack" data-library="${p.id}"><span class="pack-title">${escape(p.name)} <span style="float:right;color:#a799b3">›</span></span><span class="pack-meta">${p.stickers.length}/30 figurinhas · ${escape(p.author)}</span><div class="library-strip">${p.stickers.slice(0,4).map(s=>imageTag(s.data,s.title)).join('')||'<p>Adicione sua primeira criação ✨</p>'}</div></button>`).join(''):'<div class="empty"><span>✦</span>Seu primeiro pack te espera<p>Crie uma figurinha ou baixe um pack da aba Explorar.</p></div>'}<p class="native-note">Nesta prévia, os packs ficam no navegador. Baixe um .figpack para levar suas criações ao aplicativo nativo.</p>`;
 document.getElementById('newpack').onclick=()=>{const name=prompt('Nome do novo pack:');if(!name?.trim())return;packs.unshift({id:uid(),name:name.trim().slice(0,80),author:'Você',color:'A78BFA',stickers:[]});persist();renderLibrary()};
 document.getElementById('importpack').onclick=()=>document.getElementById('pack-input').click();
 screen.querySelectorAll('[data-library]').forEach(b=>b.onclick=()=>{detail={type:'library',id:b.dataset.library};renderDetail()});
}
function renderDetail(){
 const isCatalog=detail.type==='catalog';const p=(isCatalog?catalog:packs).find(p=>p.id===detail.id);if(!p){detail=null;render();return}
 const stickers=isCatalog?p.images.map((data,i)=>({data,title:p.titles[i]})):p.stickers;
 const installed=isCatalog&&packs.some(x=>x.sourceID===p.id);
 screen.innerHTML=`<button class="back" id="back">‹ ${isCatalog?'Explorar':'Meus packs'}</button><h1>${escape(p.name)}</h1><p>Por ${escape(p.author)} · ${stickers.length} figurinhas</p>${!isCatalog?'<div class="row"><button class="primary secondary" id="whatsapp">WhatsApp</button><button class="primary" id="iphone">iPhone</button></div>':''}<div class="sticker-grid">${stickers.map((s,i)=>`<div class="sticker-cell">${imageTag(s.data,s.title)}${!isCatalog?`<button class="delete" data-delete="${i}" aria-label="Excluir ${escape(s.title)}">×</button>`:''}</div>`).join('')}</div>${isCatalog?`<button class="primary" id="download" ${installed?'disabled':''}>${installed?'✓ Salvo em Meus packs':'↓ Baixar pack grátis'}</button><p class="native-note">Salve o pack para usar e compartilhar.</p>`:`<button class="primary" id="add-sticker">+ Criar figurinha</button><button class="primary soft" id="share" style="margin-top:12px" ${!stickers.length?'disabled':''}>↑ Baixar / compartilhar .figpack</button><p class="native-note">Abra esse arquivo no Figgy nativo. Os botões de WhatsApp e iPhone aqui mostram como funciona a integração.</p>`}`;
 document.getElementById('back').onclick=()=>{detail=null;render()};
 if(isCatalog)document.getElementById('download').onclick=()=>{packs.unshift({id:uid(),sourceID:p.id,name:p.name,author:p.author,color:p.color,stickers:stickers.map(s=>({...s,id:uid(),emojis:[]}))});persist();toast('Pack salvo! Abra Meus packs.');renderDetail()};
 else{
 document.getElementById('whatsapp').onclick=()=>info('No WhatsApp',p.stickers.length<3?'O WhatsApp exige pelo menos 3 figurinhas no pack. Adicione mais para exportar.':'No app nativo, esse botão converte as imagens para WebP e abre o WhatsApp para você confirmar a adição. A prévia no navegador não executa essa integração.');
 document.getElementById('iphone').onclick=()=>info('No teclado do iPhone','No app nativo, a extensão Figgy mostra seus packs na área de stickers do teclado de emojis, em apps compatíveis. Ela preserva a imagem inteira e não recria a figurinha pelo Fotos.');
 document.getElementById('add-sticker').onclick=()=>{editor.packID=p.id;setPage('create')};document.getElementById('share').onclick=()=>exportPack(p);
 screen.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Excluir esta figurinha?')){p.stickers.splice(+b.dataset.delete,1);persist();renderDetail()}});
 }
}
function renderEditor(){
 screen.innerHTML=`<h1>Uma ideia.<br>Mil conversas.</h1><div class="canvas-wrap"><canvas id="canvas" width="512" height="512" aria-label="Prévia da figurinha"></canvas></div><div class="row"><button class="primary" id="choose-photo">+ Escolher imagem</button><button class="primary secondary" id="export-png">↓ PNG</button></div><div class="option-card"><b>✓ Imagem inteira</b><span>Preserva fundo, bordas e texto. O recorte opcional de fundo está disponível no app iOS.</span></div><label class="field" for="caption">Diga com uma figurinha</label><input class="input" id="caption" placeholder="Escreva seu texto…" maxlength="100" value="${escape(editor.text)}"><label class="check"><input id="text-top" type="checkbox" ${editor.top?'checked':''}> Texto na parte de cima</label><label class="field" for="size">Tamanho do texto</label><input id="size" type="range" min="24" max="76" value="${editor.size}"><label class="field">Fundo</label><div class="swatches">${[null,'#E9DAFF','#FFD6E8','#BDE9D1','#FFE69B','#322346'].map((c,i)=>`<button class="swatch ${editor.background===c?'active':''}" style="background:${c||'repeating-conic-gradient(#ddd 0% 25%,white 0% 50%) 0/10px 10px'}" data-bg="${c||''}" aria-label="${['Transparente','Lilás','Rosa','Verde','Amarelo','Escuro'][i]}" aria-pressed="${editor.background===c}"></button>`).join('')}</div><label class="field" for="padding">Margem da imagem</label><input id="padding" type="range" min="0" max="64" value="${editor.padding}"><label class="field" for="target-pack">Salvar em um pack</label><select class="input" id="target-pack"><option value="">Criar novo pack</option>${packs.filter(p=>p.stickers.length<30).map(p=>`<option value="${p.id}" ${p.id===editor.packID?'selected':''}>${escape(p.name)}</option>`).join('')}</select><input class="input" id="new-name" style="margin-top:10px" value="Minhas criações" aria-label="Nome do novo pack"><button class="primary" id="save-sticker" style="margin-top:22px">✓ Salvar figurinha</button>`;
 draw();document.getElementById('choose-photo').onclick=()=>document.getElementById('photo-input').click();
 document.getElementById('caption').oninput=e=>{editor.text=e.target.value;draw()};document.getElementById('text-top').onchange=e=>{editor.top=e.target.checked;draw()};
 for(const key of ['padding','size'])document.getElementById(key).oninput=e=>{editor[key]=+e.target.value;draw()};
 screen.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{editor.background=b.dataset.bg||null;screen.querySelectorAll('[data-bg]').forEach(n=>{n.classList.toggle('active',n===b);n.setAttribute('aria-pressed',n===b)});draw()});
 document.getElementById('target-pack').onchange=e=>{editor.packID=e.target.value||null;document.getElementById('new-name').hidden=!!editor.packID};document.getElementById('new-name').hidden=!!editor.packID;
 document.getElementById('export-png').onclick=()=>{if(!editor.image&&!editor.text.trim()){toast('Escolha uma imagem ou escreva um texto.');return}draw();const a=document.createElement('a');a.href=document.getElementById('canvas').toDataURL('image/png');a.download='Minha-figurinha.png';a.click()};
 document.getElementById('save-sticker').onclick=()=>{
 if(!editor.image&&!editor.text.trim()){toast('Escolha uma imagem ou escreva um texto.');return}
 let p=packs.find(p=>p.id===editor.packID);if(!p){const name=document.getElementById('new-name').value.trim();if(!name){toast('Dê um nome ao seu pack.');return}p={id:uid(),name:name.slice(0,80),author:'Você',color:'A78BFA',stickers:[]};packs.unshift(p)}
 if(p.stickers.length>=30){toast('Esse pack está cheio. Crie outro para continuar.');return}
 p.stickers.push({id:uid(),data:document.getElementById('canvas').toDataURL('image/png'),title:editor.text||'Minha figurinha',emojis:[]});editor.packID=p.id;persist();toast('Figurinha salva no seu pack!');setPage('library');
 };
}
function draw(){const canvas=document.getElementById('canvas');if(!canvas)return;const c=canvas.getContext('2d');c.clearRect(0,0,512,512);if(editor.background){c.fillStyle=editor.background;c.fillRect(0,0,512,512)}const hasText=!!editor.text.trim();const h=hasText?Math.min(180,Math.max(100,editor.size*2.8)):0;const p=editor.padding;const ay=p+(hasText&&editor.top?h:0);const w=512-2*p,ah=512-2*p-h;
 if(editor.image){const s=Math.min(w/editor.image.width,ah/editor.image.height);const dw=editor.image.width*s,dh=editor.image.height*s;c.drawImage(editor.image,p+(w-dw)/2,ay+(ah-dh)/2,dw,dh)}
 if(hasText){c.textAlign='center';c.textBaseline='top';c.lineJoin='round';c.fillStyle='white';c.strokeStyle='#7645d9';c.lineWidth=4;let size=editor.size,lines=[];while(size>=14){c.font=`900 ${size}px system-ui`;lines=[];let line='';for(const word of editor.text.split(/\s+/)){if(c.measureText(line+' '+word).width>w-16&&line){lines.push(line);line=word}else line+=(line?' ':'')+word}if(line)lines.push(line);if(lines.length*size*1.15<=h)break;size-=2}const y=editor.top?p:512-h-p;lines.forEach((l,i)=>{c.strokeText(l,256,y+i*size*1.15,w-16);c.fillText(l,256,y+i*size*1.15,w-16)})}
 if(!editor.image&&!hasText){c.font='700 25px system-ui';c.fillStyle='#7645d9';c.textAlign='center';c.fillText('Sua criação começa aqui',256,260)}
}
function info(title,text){document.getElementById('info-title').textContent=title;document.getElementById('info-text').textContent=text;document.getElementById('info').showModal()}
document.getElementById('close-info').onclick=()=>document.getElementById('info').close();
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setPage(b.dataset.nav));
document.getElementById('photo-input').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>20*1024*1024){toast('Escolha uma imagem de até 20 MB.');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{editor.image=img;setPage('create')};img.onerror=()=>toast('Esse formato de imagem não é compatível com o navegador.');img.src=reader.result};reader.readAsDataURL(f);e.target.value=''};
async function optimizedPNG(data){const image=new Image();image.src=data;await image.decode();for(const edge of [512,480,448,384,320,300]){const canvas=document.createElement("canvas");canvas.width=canvas.height=edge;const ctx=canvas.getContext("2d");ctx.drawImage(image,0,0,edge,edge);const value=canvas.toDataURL("image/png");if(atob(value.split(",")[1]).length<500000)return value}throw Error("Imagem grande demais para o iPhone.")}
async function exportPack(p){try{const zip=new JSZip();const manifest={format:'figgy-pack',version:1,name:p.name,author:p.author,color:p.color,stickers:[]};for(let i=0;i<p.stickers.length;i++){const s=p.stickers[i];const file=`images/sticker-${i}.png`;const png=await optimizedPNG(s.data);zip.file(file,png.split(',')[1],{base64:true});manifest.stickers.push({file,title:s.title.slice(0,125),emojis:s.emojis||[]})}zip.file('manifest.json',JSON.stringify(manifest));const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Figgy-'+p.name.replace(/[^a-z0-9]/gi,'-')+'.figpack';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Pack baixado. Abra no Figgy nativo ou compartilhe o arquivo.')}catch{toast('Não consegui gerar esse pack.')}}
document.getElementById('pack-input').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>30*1024*1024)throw Error('Use um pack de até 30 MB.');const zip=await JSZip.loadAsync(f);if(Object.keys(zip.files).length>100)throw Error('O pack tem arquivos demais.');const mfile=zip.file('manifest.json');if(!mfile||mfile._data.uncompressedSize>64000)throw Error('Escolha um arquivo .figpack válido.');const m=JSON.parse(await mfile.async('string'));if(m.format!=='figgy-pack'||m.version!==1||!Array.isArray(m.stickers)||m.stickers.length<1||m.stickers.length>30||typeof m.name!=='string'||m.name.length>80)throw Error('Pack incompatível.');const stickers=[];for(const s of m.stickers){if(!/^images\/[A-Za-z0-9_-]+\.png$/.test(s.file)||!zip.file(s.file))throw Error('Imagem inválida no pack.');const entry=zip.file(s.file);if(entry._data.uncompressedSize>500000)throw Error('Uma imagem do pack é grande demais.');const data='data:image/png;base64,'+await entry.async('base64');stickers.push({id:uid(),data,title:String(s.title||'Figurinha').slice(0,125),emojis:(s.emojis||[]).slice(0,3)})}packs.unshift({id:uid(),name:m.name,author:String(m.author||'Criador').slice(0,80),color:/^[a-f0-9]{6}$/i.test(m.color)?m.color:'A78BFA',stickers});persist();setPage('library');toast('Pack importado com sucesso!')}catch(err){toast(err.message||'Não consegui abrir o pack.')}e.target.value=''};
render();
</script></body></html>
